<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">🛡️ 加載中...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: "Microsoft JhengHei", sans-serif; padding-bottom: 50px; }
        #mainContent { display: none; }
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; cursor: pointer; transition: 0.1s; }
        .card:active { transform: scale(0.96); background-color: #333; }
        .boss-name { font-size: 1.05rem; font-weight: bold; }
        .color-default { color: #ffca2c; } 
        .color-purple { color: #bf40ff; }
        .color-red { color: #ff4d4d; }
        .color-blue { color: #4da6ff; }
        .countdown { font-size: 1.3rem; font-family: 'Segoe UI', monospace; color: #00ff00; font-weight: bold; }
        .warning { background-color: #4a0000 !important; border-color: #ff0000; animation: blinker 1.5s linear infinite; }
        .off-day { opacity: 0.3; filter: grayscale(1); }
        @keyframes blinker { 50% { opacity: 0.7; } }
        .btn-gold { background-color: #ffca2c; color: #000; font-weight: bold; border: none; }
        #cmd { background-color: #2a2a2a; color: #fff; border: 1px solid #ffca2c; font-size: 1.1rem; }
        #liveLogBox { font-size: 0.85rem; background: #000; color: #00ff00; border: 1px solid #444; border-radius: 8px; height: 120px; overflow-y: auto; padding: 10px; font-family: monospace; }
        .modal-content { background-color: #1e1e1e; color: #e0e0e0; border: 1px solid #444; }
        #fullLogArea { font-size: 0.9rem; background: #000; color: #aaa; height: 400px; overflow-y: auto; padding: 15px; font-family: monospace; }
        .log-item { border-bottom: 1px solid #222; padding: 6px 0; }
        .log-user { color: #ffca2c; font-weight: bold; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="text-center p-4">
        <h3 class="mb-4">🔒 團隊私人頻道</h3>
        <button class="btn btn-gold px-5 py-2 mb-3" onclick="startCloudAuth()">點擊解鎖王表</button>
        <p class="text-secondary" style="font-size: 0.85rem;">由 <span class="dyn-admin">管理員</span> 提供技術支援</p>
    </div>
</div>

<div id="mainContent" class="container py-4">
    <h3 class="text-center mb-4">🛡️ <span class="dyn-admin">管理員</span>王團秘書</h3>
    
    <div class="card p-3 mb-4 shadow" style="cursor: default;">
        <div class="input-group">
            <input type="text" id="cmd" class="form-control" placeholder="輸入 [時間+王名]" onkeypress="if(event.keyCode==13) handleCommand()">
            <button class="btn btn-gold" onclick="handleCommand()">執行</button>
        </div>

        <div class="mt-3">
            <div style="font-size: 0.8rem; color: #888; margin-bottom: 4px;">📡 最近即時動態：</div>
            <div id="liveLogBox">連線中...</div>
        </div>

        <div class="mt-3 d-flex flex-wrap justify-content-center gap-2 border-top pt-3 border-secondary">
            <button class="btn btn-outline-warning btn-sm" onclick="handleCommand('CD減半')">⚡ CD減半</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="handleCommand('CD恢復')">🔄 CD恢復</button>
            <button class="btn btn-info btn-sm" data-bs-toggle="modal" data-bs-target="#logModal">📜 所有記錄</button>
            <button class="btn btn-light btn-sm" onclick="changeMyName()">✍️ 修改名字</button>
            <button class="btn btn-outline-danger btn-sm" onclick="adminReset()">🧹 數據重置</button>
        </div>
        <div class="mt-2 text-center">
            <span id="syncStatus" class="badge bg-secondary">等待授權...</span>
        </div>
    </div>

    <div id="bossContainer" class="row g-2"></div>
</div>

<div class="modal fade" id="logModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">📜 完整歷史記錄</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <div id="fullLogArea">載入中...</div>
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
      </div>
    </div>
  </div>
</div>

<script>
// Firebase 配置
const firebaseConfig = {
  apiKey: "AIzaSyAiPLZv4zBUDG3z2zQSnlt31K-IOoLW-Gs",
  authDomain: "mybosstimer.firebaseapp.com",
  databaseURL: "https://mybosstimer-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mybosstimer",
  storageBucket: "mybosstimer.firebasestorage.app",
  messagingSenderId: "43002364713",
  appId: "1:43002364713:web:8a19b0c5eb5eae4d3b6d38"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const rootRef = db.ref('bossData');
const dataRef = db.ref('bossData/SECRETARY_PRO_DATA');
const authRef = db.ref('bossData/auth_code'); // 唯一的驗證欄位
const logRef = db.ref('bossData/bossLogs');
const adminNameRef = db.ref('bossData/ADMIN_NAME');

let bosses = [];
let myName = localStorage.getItem('userName') || "";

// 監聽管理員名稱
adminNameRef.on('value', (snap) => {
    const val = snap.val() || "團隊管理員";
    document.querySelectorAll('.dyn-admin').forEach(el => el.innerText = val);
    document.title = `🛡️ ${val}王團秘書`;
});

document.addEventListener("DOMContentLoaded", () => {
    // 檢查授權狀態
    if (sessionStorage.getItem('isAuthorized') === 'true') {
        unlockApp();
    }
});

function startCloudAuth() {
    authRef.once('value').then((snap) => {
        const dbCode = snap.val();
        if (!dbCode) {
            alert("錯誤：資料庫中找不到 auth_code 欄位，請在 Firebase 手動新增此鍵。");
            return;
        }
        const input = prompt("請輸入團隊通行碼：");
        if (input && input.toString() === dbCode.toString()) {
            sessionStorage.setItem('isAuthorized', 'true');
            sessionStorage.setItem('tempAuth', input); // 存入當前正確的驗證碼
            if(!myName) {
                myName = prompt("您的代號：") || "成員";
                localStorage.setItem('userName', myName);
            }
            unlockApp();
        } else if (input !== null) {
            alert("驗證失敗！");
        }
    });
}

function unlockApp() {
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    
    dataRef.on('value', (snap) => {
        const d = snap.val();
        if (d) { bosses = d; render(); document.getElementById('syncStatus').innerText = "雲端同步中"; document.getElementById('syncStatus').className = "badge bg-success"; }
    });

    logRef.limitToLast(30).on('value', (snap) => {
        const liveBox = document.getElementById('liveLogBox');
        const fullArea = document.getElementById('fullLogArea');
        liveBox.innerHTML = ''; fullArea.innerHTML = '';
        const logs = []; snap.forEach(c => { logs.push(c.val()); }); 
        logs.forEach(l => { 
            const html = `<div class="log-item"><span style="color:#666;">[${l.time}]</span> <span class="log-user">${l.user}</span>: ${l.msg}</div>`;
            liveBox.innerHTML += html; fullArea.innerHTML += html;
        });
        setTimeout(() => { liveBox.scrollTop = liveBox.scrollHeight; fullArea.scrollTop = fullArea.scrollHeight; }, 100); 
    });
}

function changeMyName() {
    const oldName = myName;
    const newName = prompt("請輸入您的新代號：", oldName);
    if (newName && newName !== oldName) {
        myName = newName;
        localStorage.setItem('userName', myName);
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        logRef.push({ time: timeStr, user: "系統通知", msg: `👤 將代號從 [${oldName}] 修改為 [${newName}]` });
        alert("代號已更新為：" + myName);
    }
}

function handleCommand(manual) {
    const cmdInput = document.getElementById('cmd');
    const input = (manual || cmdInput.value).trim();
    cmdInput.value = '';
    if(!input) return;
    
    let update = false, logMsg = "";
    const activeAuth = sessionStorage.getItem('tempAuth');

    if (input === "CD減半" || input === "CD恢復") {
        const isHalf = input === "CD減半";
        bosses.forEach(b => { 
            if(b.type==='cd'){ 
                b.cd = isHalf ? b.origCd/2 : b.origCd; 
                if(b.lastDeath) b.spawn = b.lastDeath + (b.cd * 3600000); 
            }
        });
        update = true; logMsg = `執行了 [${input}]`;
    } else {
        let tMatch = input.match(/(\d{1,2}):?(\d{2})/);
        let n = input.replace(/(\d{1,2}):?(\d{2})/, "").trim();
        if(tMatch && n) {
            const h = parseInt(tMatch[1]), m = parseInt(tMatch[2]);
            if (h > 23 || m > 59) { alert("❗無效時間"); return; }
            const b = bosses.find(x => (x.name && (x.name.includes(n)||n.includes(x.name))) || (x.alias && x.alias.split(',').some(a=>n.includes(a))));
            if(b && b.type==='cd') {
                let d = new Date(); d.setHours(h,m,0,0); if(d > new Date()) d.setDate(d.getDate()-1);
                b.lastDeath = d.getTime(); b.spawn = b.lastDeath + (b.cd * 3600000);
                update = true; logMsg = `更新 [${b.name}] ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            }
        }
    }

    if(update) {
        // 核心修正：確保傳送給 Firebase 的是 auth_code 且值為當前 Session 的正確驗證碼
        rootRef.update({ 
            "SECRETARY_PRO_DATA": bosses, 
            "auth_code": activeAuth 
        }).then(() => {
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            logRef.push({ time: timeStr, user: myName, msg: logMsg });
        }).catch(err => {
            alert("寫入失敗！請檢查資料庫 auth_code 是否正確或權限是否開啟。");
            console.error(err);
        });
    }
}

function adminReset() {
    if(confirm("❗確定要完全重置數據嗎？")) {
        const p = prompt("請輸入重置密碼：");
        if(p !== null) {
            const now = new Date();
            const correctResetCode = now.getFullYear() - (now.getMonth() + 1) - now.getDate();
            if(Number(p) === correctResetCode) {
                const activeAuth = sessionStorage.getItem('tempAuth');
                bosses.forEach(b => { if(b.type==='cd') { delete b.lastDeath; delete b.spawn; } });
                rootRef.update({ 
                    "SECRETARY_PRO_DATA": bosses, 
                    "auth_code": activeAuth, 
                    "bossLogs": null 
                }).then(() => {
                    alert("數據重置成功"); location.reload();
                });
            } else { alert("密碼驗證錯誤！"); }
        }
    }
}

function quickInput(name) {
    const el = document.getElementById('cmd');
    el.value = name; el.focus(); el.setSelectionRange(0, 0); 
}

function render() {
    const container = document.getElementById('bossContainer');
    if(!container) return; container.innerHTML = '';
    const now = new Date(), today = now.getDay() === 0 ? 7 : now.getDay();
    let sorted = bosses.map(b => {
        let sortTime = 9999999999999, isOff = false, disp = "未記錄", cdText = "下次重生：", warn = false;
        if(b.type === 'fixed') {
            if(b.weekday && b.weekday !== today) { isOff = true; disp = `週(${b.weekday}) ${b.times[0]}`; sortTime = 2e12 + (b.weekday*1e8); }
            else {
                let f = false; for(let t of b.times) {
                    let tg = new Date(); tg.setHours(t.split(':')[0], t.split(':')[1], 0, 0);
                    if((tg-now)/6e4 > -5) { sortTime = tg.getTime(); disp = t; if((tg-now)/6e4 <= 5) warn = true; f = true; break; }
                }
                if(!f) { disp = "今日結束"; isOff = true; sortTime = 3e12; }
            }
        } else if (b.spawn) {
            sortTime = b.spawn; let diff = (b.spawn - now.getTime()) / 6e4;
            let sd = new Date(b.spawn); disp = sd.getHours().toString().padStart(2,'0') + ":" + sd.getMinutes().toString().padStart(2,'0');
            if(diff <= 5 && diff > 0) warn = true;
            cdText = diff <= 0 ? "已重生！" : `剩餘 ${Math.floor(diff/60)}時${Math.floor(diff%60)}分`;
        }
        return { ...b, sortTime, isOff, disp, cdText, warn };
    });
    sorted.sort((a, b) => a.sortTime - b.sortTime);
    sorted.forEach(b => {
        let color = "color-default";
        if (b.type === 'fixed' && b.weekday) color = "color-purple";
        else if (b.origCd >= 12) color = "color-purple";
        else if (b.origCd >= 8) color = "color-red";
        else if (b.origCd >= 4) color = "color-blue";
        container.innerHTML += `<div class="col-6 col-md-4 col-lg-3"><div class="card p-2 ${b.isOff ? 'off-day' : ''} ${b.warn ? 'warning' : ''}" onclick="quickInput('${b.name}')"><div class="d-flex justify-content-between"><div class="boss-name text-truncate ${color}">${b.name}</div><span class="badge ${b.type==='fixed'?'bg-primary':'bg-secondary'}" style="font-size:0.6rem;">${b.type==='fixed'?'固定':b.cd+'h'}</span></div><div style="font-size:0.75rem; color:#888;">${b.alias}</div><div class="mt-2 pt-2 border-top border-secondary"><div style="font-size:0.7rem; color:#aaa;">${b.cdText}</div><div class="countdown">${b.disp}</div></div></div></div>`;
    });
}
setInterval(render, 30000); 
</script>
</body>
</html>
