<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ 天堂W王團秘書</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: "Microsoft JhengHei", sans-serif; padding-bottom: 50px; }
        #mainContent { display: none; }
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; transition: 0.1s; cursor: pointer; }
        .card:active { transform: scale(0.96); background-color: #333; }
        .boss-name { font-size: 1.05rem; font-weight: bold; }
        .color-default { color: #ffca2c; } 
        .color-purple { color: #bf40ff; }
        .color-red { color: #ff4d4d; }
        .color-blue { color: #4da6ff; }
        .countdown { font-size: 1.3rem; font-family: 'Segoe UI', monospace; color: #00ff00; font-weight: bold; }
        .warning { background-color: #4a0000 !important; border-color: #ff0000; animation: blinker 1.5s linear infinite; }
        .off-day { opacity: 0.3; filter: grayscale(1); }
        @keyframes blinker { 50% { opacity: 0.7; } }
        .btn-gold { background-color: #ffca2c; color: #000; font-weight: bold; border: none; }
        #cmd { background-color: #2a2a2a; color: #fff; border: 1px solid #ffca2c; font-weight: bold; }
        #logArea { font-size: 0.8rem; background: #000; color: #aaa; border: 1px solid #444; border-radius: 8px; height: 150px; overflow-y: auto; padding: 10px; }
        .log-item { border-bottom: 1px solid #222; padding-bottom: 2px; }
        .log-user { color: #4da6ff; font-weight: bold; }
    </style>
</head>
<body>

<script>
    // 網域檢驗
    (function() {
        if (window.location.hostname !== "william687888.github.io" && window.location.hostname !== "localhost") {
            document.body.innerHTML = "<h2 style='color:red;text-align:center;margin-top:50px;'>⚠️ 授權網域錯誤</h2>"; 
            window.stop();
        }
    })();
</script>

<div id="authOverlay">
    <div class="text-center p-4">
        <h3 class="mb-4">🔒 團隊私人頻道</h3>
        <button class="btn btn-gold px-5 py-2 mb-3" onclick="startCloudAuth()">點擊解鎖王表</button>
        <p class="text-secondary" style="font-size: 0.85rem;">由 翊達科技 提供技術支援</p>
    </div>
</div>

<div id="mainContent" class="container py-4">
    <h3 class="text-center mb-4">🛡️ 天堂W王團秘書</h3>
    
    <div class="card p-3 mb-4 shadow" style="cursor: default;">
        <div class="input-group">
            <input type="text" id="cmd" class="form-control" placeholder="輸入 [王名+時間] 例如: 巨鱷1230" onkeypress="if(event.keyCode==13) handleCommand()">
            <button class="btn btn-gold" onclick="handleCommand()">執行</button>
        </div>
        <div class="mt-2 text-center">
            <button class="btn btn-outline-warning btn-sm m-1" onclick="handleCommand('CD減半')">⚡ CD減半</button>
            <button class="btn btn-outline-secondary btn-sm m-1" onclick="handleCommand('CD恢復')">🔄 CD恢復</button>
            <span id="syncStatus" class="badge bg-secondary ms-2">等待授權...</span>
        </div>
        <div class="mt-3">
            <div id="logArea">正在讀取雲端數據...</div>
        </div>
    </div>
    <div id="bossContainer" class="row g-2"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAiPLZv4zBUDG3z2zQSnlt31K-IOoLW-Gs",
  authDomain: "mybosstimer.firebaseapp.com",
  databaseURL: "https://mybosstimer-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mybosstimer",
  storageBucket: "mybosstimer.firebasestorage.app",
  messagingSenderId: "43002364713",
  appId: "1:43002364713:web:8a19b0c5eb5eae4d3b6d38"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const rootRef = db.ref('bossData');
const dataRef = db.ref('bossData/SECRETARY_PRO_DATA');
const authRef = db.ref('bossData/TEAM_AUTH_CODE');
const logRef = db.ref('bossData/bossLogs');

let bosses = [];
let myName = localStorage.getItem('userName') || "";

document.addEventListener("DOMContentLoaded", () => {
    if (sessionStorage.getItem('isAuthorized') === 'true') unlockApp();
});

function startCloudAuth() {
    authRef.once('value').then((snap) => {
        const correctCode = snap.val();
        const input = prompt("請輸入團隊通行碼：");
        if (input && input.toString() === correctCode.toString()) {
            sessionStorage.setItem('isAuthorized', 'true');
            sessionStorage.setItem('tempAuth', input); // 暫存通行碼供寫入使用
            if(!myName) {
                myName = prompt("您的代號：") || "成員";
                localStorage.setItem('userName', myName);
            }
            unlockApp();
        } else if (input !== null) alert("通行碼驗證失敗！");
    });
}

function unlockApp() {
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    
    dataRef.on('value', (snap) => {
        const d = snap.val();
        if (d) { 
            bosses = d; render(); 
            document.getElementById('syncStatus').innerText = "雲端同步中"; 
            document.getElementById('syncStatus').className = "badge ms-2 bg-success"; 
        }
    });

    logRef.limitToLast(10).on('value', (snap) => {
        const area = document.getElementById('logArea');
        area.innerHTML = '';
        const logs = []; snap.forEach(c => { logs.unshift(c.val()); });
        logs.forEach(l => { area.innerHTML += `<div class="log-item">[${l.time}] <span class="log-user">${l.user}</span>: ${l.msg}</div>`; });
    });
}

function handleCommand(manual) {
    const input = (manual || document.getElementById('cmd').value).trim();
    document.getElementById('cmd').value = '';
    if(!input) return;

    let update = false, logMsg = "";

    if (input === "CD減半" || input === "CD恢復") {
        const isHalf = input === "CD減半";
        bosses.forEach(b => { 
            if(b.type==='cd'){ 
                b.cd = isHalf ? b.origCd/2 : b.origCd; 
                if(b.lastDeath) b.spawn = b.lastDeath + (b.cd * 3600000); 
            }
        });
        update = true; logMsg = `執行了 [${input}]`;
    } else {
        let t = input.match(/\d{4}/), n = input.replace(/\d{4}/, "").trim();
        if(t && n) {
            const h = parseInt(t[0].substring(0,2)), m = parseInt(t[0].substring(2,4));
            const b = bosses.find(x => (x.name && (x.name.includes(n)||n.includes(x.name))) || (x.alias && x.alias.split(',').some(a=>n.includes(a))));
            if(b && b.type==='cd') {
                let d = new Date(); d.setHours(h,m,0,0); if(d > new Date()) d.setDate(d.getDate()-1);
                b.lastDeath = d.getTime(); b.spawn = b.lastDeath + (b.cd * 3600000);
                update = true; logMsg = `更新 [${b.name}] ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
            }
        }
    }

    if(update) {
        // 同步發送當前使用的通行碼，供 Firebase Rules 校驗
        const currentCode = sessionStorage.getItem('tempAuth');
        rootRef.update({
            "SECRETARY_PRO_DATA": bosses,
            "auth_code": currentCode 
        }).then(() => {
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            logRef.push({ time: timeStr, user: myName, msg: logMsg });
        }).catch(err => {
            alert("⚠️ 權限不足或連線逾時，請重新整理頁面解鎖。");
        });
    }
}

function render() {
    const container = document.getElementById('bossContainer');
    if(!container) return; container.innerHTML = '';
    const now = new Date(), today = now.getDay() === 0 ? 7 : now.getDay();
    
    let sorted = bosses.map(b => {
        let sortTime = 9999999999999, isOff = false, disp = "未記錄", cdText = "下次重生：", warn = false;
        if(b.type === 'fixed') {
            if(b.weekday && b.weekday !== today) { isOff = true; disp = `週(${b.weekday}) ${b.times[0]}`; sortTime = 2e12 + (b.weekday*1e8); }
            else {
                let f = false; for(let t of b.times) {
                    let tg = new Date(); tg.setHours(t.split(':')[0], t.split(':')[1], 0, 0);
                    if((tg-now)/6e4 > -5) { sortTime = tg.getTime(); disp = t; if((tg-now)/6e4 <= 5) warn = true; f = true; break; }
                }
                if(!f) { disp = "今日結束"; isOff = true; sortTime = 3e12; }
            }
        } else if (b.spawn) {
            sortTime = b.spawn; let diff = (b.spawn - now.getTime()) / 6e4;
            let sd = new Date(b.spawn); disp = sd.getHours().toString().padStart(2,'0') + ":" + sd.getMinutes().toString().padStart(2,'0');
            if(diff <= 5 && diff > 0) warn = true;
            cdText = diff <= 0 ? "已重生！" : `剩餘 ${Math.floor(diff/60)}時${Math.floor(diff%60)}分`;
        }
        return { ...b, sortTime, isOff, disp, cdText, warn };
    });
    
    sorted.sort((a, b) => a.sortTime - b.sortTime);
    sorted.forEach(b => {
        let color = "color-default";
        if (b.type === 'fixed' && b.weekday) color = "color-purple";
        else if (b.origCd >= 12) color = "color-purple";
        else if (b.origCd >= 8) color = "color-red";
        else if (b.origCd >= 4) color = "color-blue";
        container.innerHTML += `
            <div class="col-6 col-md-4 col-lg-3">
                <div class="card p-2 ${b.isOff ? 'off-day' : ''} ${b.warn ? 'warning' : ''}" onclick="document.getElementById('cmd').value='${b.name}';document.getElementById('cmd').focus();">
                    <div class="d-flex justify-content-between">
                        <div class="boss-name text-truncate ${color}">${b.name}</div>
                        <span class="badge ${b.type==='fixed'?'bg-primary':'bg-secondary'}" style="font-size:0.6rem;">${b.type==='fixed'?'固定':b.cd+'h'}</span>
                    </div>
                    <div style="font-size:0.75rem; color:#888;">${b.alias}</div>
                    <div class="mt-2 pt-2 border-top border-secondary">
                        <div style="font-size:0.7rem; color:#aaa;">${b.cdText}</div>
                        <div class="countdown">${b.disp}</div>
                    </div>
                </div>
            </div>`;
    });
}
setInterval(render, 30000); 
</script>
</body>
</html>
