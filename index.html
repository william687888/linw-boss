<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛡️ 天堂W王團秘書 - 翊達科技</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: "Microsoft JhengHei", sans-serif; }
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #mainContent { display: none; padding: 15px; }
        
        /* 核心顏色修正 */
        .color-gold { color: #ffca2c !important; }
        .color-purple { color: #bf40ff !important; }
        .color-red { color: #ff4d4d !important; }
        .color-blue { color: #4da6ff !important; }
        .color-gray { color: #aaaaaa !important; }

        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; margin-bottom: 10px; }
        .boss-name { font-size: 1.1rem; font-weight: bold; }
        .countdown { font-size: 1.4rem; color: #00ff00; font-weight: bold; font-family: monospace; }
        .alias-text { color: #888; font-size: 0.85rem; }
        #logArea { font-size: 0.8rem; background: #000; color: #888; height: 100px; overflow-y: auto; padding: 8px; border-radius: 5px; }
        .btn-gold { background-color: #ffca2c; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div id="authOverlay">
    <button class="btn btn-gold btn-lg" onclick="verifyAccess()">🔓 解鎖王表</button>
</div>

<div id="mainContent">
    <h4 class="text-center mb-3">🛡️ 天堂W王團秘書</h4>
    
    <div class="card p-3 mb-3">
        <div class="input-group mb-2">
            <input type="text" id="cmd" class="form-control bg-dark text-white" placeholder="輸入：巨鱷1230">
            <button class="btn btn-gold" onclick="handleCommand()">執行</button>
        </div>
        <div id="logArea">正在載入紀錄...</div>
    </div>

    <div id="bossContainer" class="row g-2"></div>
</div>

<script>
// --- 安全保護與網域檢查 ---
const _0x1a2b = ['william687888.github.io', 'location', 'hostname', 'body', 'innerHTML'];
if (window[_0x1a2b[1]][_0x1a2b[2]] !== _0x1a2b[0]) {
    document[_0x1a2b[3]][_0x1a2b[4]] = 'Unauthorized Access';
}

// --- Firebase 配置 ---
const firebaseConfig = {
    apiKey: "AIzaSyAiPLZv4zBUDG3z2zQSnlt31K-IOoLW-Gs",
    authDomain: "mybosstimer.firebaseapp.com",
    databaseURL: "https://mybosstimer-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mybosstimer",
    appId: "1:43002364713:web:8a19b0c5eb5eae4d3b6d38"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let bossData = [];
let userName = localStorage.getItem('userName') || '';

async function verifyAccess() {
    const snap = await db.ref('bossData/TEAM_AUTH_CODE').once('value');
    const correctCode = snap.val();
    const input = prompt('請輸入團隊代號：');
    
    if (input === String(correctCode)) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        initApp();
    } else {
        alert('代碼錯誤！');
    }
}

function initApp() {
    if (!userName) {
        userName = prompt('請輸入您的稱呼：') || '成員';
        localStorage.setItem('userName', userName);
    }

    // 監聽王怪數據
    db.ref('bossData/SECRETARY_PRO_DATA').on('value', snap => {
        bossData = snap.val() || [];
        renderBosses();
    });

    // 監聽日誌
    db.ref('bossData/bossLogs').limitToLast(10).on('value', snap => {
        const logArea = document.getElementById('logArea');
        logArea.innerHTML = '';
        snap.forEach(child => {
            const l = child.val();
            logArea.innerHTML += `<div>[${l.time}] <b>${l.user}</b>: ${l.msg}</div>`;
        });
        logArea.scrollTop = logArea.scrollHeight;
    });
}

function renderBosses() {
    const container = document.getElementById('bossContainer');
    container.innerHTML = '';
    const now = new Date().getTime();

    // 排序：重生時間近的排前面
    const sorted = [...bossData].sort((a, b) => (a.spawn || 0) - (b.spawn || 0));

    sorted.forEach(boss => {
        let colorClass = 'color-gold';
        let timeDisp = '--:--';
        let countdownText = '等待中';

        if (boss.type === 'fixed') {
            colorClass = 'color-purple';
            timeDisp = boss.times ? boss.times[0] : '固定';
        } else if (boss.spawn) {
            // 判斷顏色
            if (boss.cd >= 12) colorClass = 'color-gray';
            else if (boss.cd >= 8) colorClass = 'color-red';
            else if (boss.cd >= 4) colorClass = 'color-blue';

            const d = new Date(boss.spawn);
            timeDisp = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            
            const diff = Math.floor((boss.spawn - now) / 60000);
            countdownText = diff <= 0 ? '已重生！' : `剩餘 ${Math.floor(diff/60)}時${diff%60}分`;
        }

        const html = `
            <div class="col-6 col-md-4">
                <div class="card p-2" onclick="quickFill('${boss.name}')">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="boss-name ${colorClass}">${boss.name}</div>
                        <span class="badge ${boss.type==='fixed'?'bg-primary':'bg-secondary'}" style="font-size:0.6rem">
                            ${boss.type==='fixed'?'固定': boss.cd+'H'}
                        </span>
                    </div>
                    <div class="alias-text text-truncate">${boss.alias || ''}</div>
                    <div class="mt-2">
                        <div style="font-size:0.7rem; color:#666">下次重生：</div>
                        <div class="countdown">${timeDisp}</div>
                        <div style="font-size:0.75rem; color:#00ff00">${countdownText}</div>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML += html;
    });
}

function quickFill(name) {
    document.getElementById('cmd').value = name;
    document.getElementById('cmd').focus();
}

function handleCommand() {
    const input = document.getElementById('cmd');
    const val = input.value.trim();
    if (!val) return;

    db.ref('bossData/bossLogs').push({
        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
        user: userName,
        msg: `執行了 [${val}]`
    });
    input.value = '';
}
</script>

</body>
</html>
