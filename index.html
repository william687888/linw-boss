<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️天堂W王團秘書</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: "Microsoft JhengHei", sans-serif; padding-bottom: 50px; }
        #mainContent { display: none; }
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; transition: 0.1s; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .card:active { transform: scale(0.96); background-color: #333; }
        .boss-name { font-size: 1.05rem; font-weight: bold; pointer-events: none; }
        .color-default { color: #ffca2c; } 
        .color-purple { color: #bf40ff; }
        .color-red { color: #ff4d4d; }
        .color-blue { color: #4da6ff; }
        .countdown { font-size: 1.3rem; font-family: 'Segoe UI', monospace; color: #00ff00; font-weight: bold; pointer-events: none; }
        .warning { background-color: #4a0000 !important; border-color: #ff0000; animation: blinker 1.5s linear infinite; }
        .off-day { opacity: 0.3; filter: grayscale(1); }
        @keyframes blinker { 50% { opacity: 0.7; } }
        .btn-gold { background-color: #ffca2c; color: #000; font-weight: bold; border: none; }
        #cmd { background-color: #2a2a2a; color: #fff; border: 1px solid #ffca2c; font-weight: bold; font-size: 1.1rem; }
        .badge-fixed { background-color: #0d6efd; padding: 4px 8px; font-size: 0.75rem; }
        .badge-cd { background-color: #6c757d; padding: 4px 8px; font-size: 0.75rem; }
        .info-row { border-top: 1px solid #333; margin-top: auto; padding-top: 8px; pointer-events: none; }
        .label-text { font-size: 0.75rem; color: #aaa; }
        .alias-text { font-size: 0.8rem; color: #bbb; margin-bottom: 5px; pointer-events: none; font-weight: 500; }
        #logArea { font-size: 0.8rem; background: #000; color: #aaa; border: 1px solid #444; border-radius: 8px; height: 150px; overflow-y: auto; padding: 10px; }
        .log-item { border-bottom: 1px solid #222; margin-bottom: 4px; padding-bottom: 2px; }
        .log-user { color: #4da6ff; font-weight: bold; }
        .log-action { color: #ffca2c; }
        .modal-content { background-color: #1e1e1e; color: #eee; border: 1px solid #444; }
        .modal-header { border-bottom: 1px solid #333; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="text-center p-4">
        <h3 class="mb-4">🔒 團隊私人頻道</h3>
        <button class="btn btn-gold px-5 py-2 mb-3" onclick="startCloudAuth()">點擊解鎖王表</button>
        <p class="text-secondary" style="font-size: 0.85rem;">請向管理員索取今日通行碼</p>
    </div>
</div>

<div id="mainContent" class="container py-4">
    <h3 class="text-center mb-4">🛡️天堂W王團秘書</h3>
    
    <div class="card p-3 mb-4 shadow" style="cursor: default;">
        <div class="input-group">
            <input type="text" id="cmd" class="form-control" placeholder="輸入 [王名+時間] 例如: 巨鱷1230" onkeypress="if(event.keyCode==13) handleCommand()">
            <button class="btn btn-gold" onclick="handleCommand()">執行</button>
        </div>
        <div class="mt-2 text-center">
            <button class="btn btn-outline-warning btn-sm m-1" onclick="handleCommand('CD減半')">⚡ CD減半</button>
            <button class="btn btn-outline-secondary btn-sm m-1" onclick="handleCommand('CD恢復')">🔄 CD恢復</button>
            <button class="btn btn-outline-danger btn-sm m-1" onclick="resetData()">🛠️ 管理員重置</button>
            <span id="syncStatus" class="badge bg-secondary ms-2">等待授權...</span>
        </div>
        
        <div class="mt-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="label-text">📋 最近 10 筆紀錄</span>
                <div>
                    <button class="btn btn-link btn-sm p-0 text-secondary me-2" style="text-decoration:none;" onclick="openFullLogs()">👁️ 查看完整日誌</button>
                    <button class="btn btn-link btn-sm p-0 text-info" style="text-decoration:none;" onclick="clearMyIdentity()">👤 修改代號</button>
                </div>
            </div>
            <div id="logArea">正在讀取...</div>
        </div>
    </div>
    <div id="bossContainer" class="row g-2"></div>
</div>

<div class="modal fade" id="logModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">📜 完整歷史操作紀錄 (100筆)</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="fullLogBody" style="font-family: monospace; font-size: 0.85rem;">載入中...</div>
    </div>
  </div>
</div>
